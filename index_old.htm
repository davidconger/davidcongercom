var activeImagesArray = new Array(8);

var lastId = -1;
var totalRotations = 0;

var keepRotating = false;

function RotateImage()
{
	var nextId = -1;
	do
	{
		nextId = Math.floor(Math.random()*8);
	}while (nextId == lastId);
	lastId = nextId;
	var imageId = "image"+nextId;

	var nextImage = "";
	
	do
	{
		var nextImageId=Math.floor(Math.random()*imageArray.length);
		nextImage = imageArray[nextImageId];
	} while (ImageAlreadyActive(nextImage));

    document.getElementById(imageId).src = "images/home/" + nextImage; 
    activeImagesArray[nextId] = nextImage;
    
    if (keepRotating && totalRotations < 50)
    {
	    window.setTimeout("RotateImage()",1500)
    }
    
    totalRotations++;
}

function ImageAlreadyActive(imageName)
{
	for(var i=0; i<8; i++)
	{
		if (activeImagesArray[i].substr(0, activeImagesArray[i].indexOf(".") - 1) == imageName.substr(0, imageName.indexOf(".") - 1))
		{
			return true;
		}
	}
	return false;
}

function Start()
{
	for(var i=0; i<8; i++)
	{
		var currentImage = document.getElementById("image"+i).src;
		activeImagesArray[i] = currentImage.substring(currentImage.lastIndexOf("/") + 1);
	}
	
	window.setTimeout("RotateImage()",1500)
	keepRotating = true;
}
