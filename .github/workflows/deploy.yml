# Deploys the site's code and markup to Azure App Service over FTP.
#
# Only what git tracks is shipped, which is the ~138 MB of HTML, CSS, JS and
# icons. The 5.3 GB of photographs are deliberately not in the repository and
# stay untouched on the server, so this workflow can never re-upload or delete
# them.
#
# It is manual on purpose. Deploys have never been automated on this site, and
# the first few should be watched. Run it with dry-run left on to see exactly
# what would change before letting it write anything.
#
# Required repository secrets, taken from the App Service publish profile
# (Portal -> davidconger -> Overview -> Download publish profile, "FTP" entry):
#
#   AZURE_FTP_SERVER    e.g. ftps://waws-prod-ch1-011.ftp.azurewebsites.windows.net/site/wwwroot/
#   AZURE_FTP_USERNAME  e.g. davidconger\$davidconger
#   AZURE_FTP_PASSWORD

name: Deploy site

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'List changes without uploading anything'
        type: boolean
        default: true
      scope:
        description: 'What to ship'
        type: choice
        default: config-only
        options:
          - config-only
          - images
          - full
      reset-state:
        description: 'Reset the server baseline first, so this deploy cannot delete anything'
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Cheap guards. A malformed web.config takes the whole site down with a
      # 500, and a sitemap that has lost URLs quietly drops pages out of search.
      #
      # The floor is 2,400. The sitemap deliberately lists only pages worth
      # ranking -- 2,343 gallery pages, 324 event pages and the top level -- and
      # leaves out the 8,045 single-photo and pagination pages that used to make
      # up three quarters of it. Those URLs still answer; they are simply not
      # advertised. If this number falls below the floor, something has gone
      # wrong with the walk rather than with the site.
      # xmllint used to do this, but ubuntu-latest no longer ships
      # libxml2-utils. Python is preinstalled and its parser is just as strict
      # about well-formedness, so this needs no apt-get.
      - name: Validate XML
        run: python3 -c "import sys,xml.dom.minidom as m; [m.parse(f) for f in sys.argv[1:]]; print('XML OK')" web.config sitemap.xml

      - name: Validate sitemap coverage
        run: >
          node -e "const s=require('fs').readFileSync('sitemap.xml','utf8');
          const ns=s.includes('xmlns=\"http://www.sitemaps.org/schemas/sitemap/0.9\"');
          const n=(s.match(/<loc>/g)||[]).length;
          if(!ns) throw new Error('wrong sitemap namespace');
          if(n<2400) throw new Error('sitemap only lists '+n+' URLs');
          console.log('sitemap.xml OK, '+n+' URLs');"

      # The deploy runs from a git checkout, and git does not track the 43,000
      # photographs -- so on a runner every <img> points at a file that is not
      # there, and an unfiltered run reports ~48,500 broken references. Skipping
      # image extensions checks what CI can actually see: page-to-page links,
      # stylesheets and scripts. That is the failure mode this gate is for, since
      # a bad bulk edit across 11,400 pages breaks relative paths, not filenames.
      #
      # 69 references are broken today and have been for years, nearly all inside
      # archived trees whose relative paths broke when they were moved. The
      # ceiling is what catches a change making it worse. Run it without the
      # filter on a full local copy to check the image references too.
      - name: Check for broken references
        run: node tools/check-links.js . --skip-ext jpg,jpeg --max-broken 90

      # web.config is the one file that can take the whole site down. Its rewrite
      # section has never run against real IIS, and if URL Rewrite were missing or
      # the 747-entry map were rejected, every page would answer 500. So the first
      # deploy ships it on its own, together with the 404 page it references, and
      # the smoke test below confirms IIS accepted it. Only then is `full` worth
      # running.
      - name: Stage the config-only payload
        if: ${{ inputs.scope == 'config-only' }}
        run: |
          mkdir -p _deploy-config
          cp web.config 404.htm _deploy-config/

      # The full scope excludes every .jpg, which protects the 5.3 GB archive but
      # also means the small generated thumbnails can never reach the server. This
      # scope ships exactly those: the /you/ event thumbnails, the /catalog/ grid
      # images and the page chrome under /images/. `git ls-files` is the filter,
      # so what gets staged is by definition the tracked site furniture and never
      # a photograph.
      - name: Stage the images payload
        if: ${{ inputs.scope == 'images' }}
        run: |
          mkdir -p _deploy-images
          git ls-files -z 'you/*/*/thumbnail.jpg' 'catalog/**/*.jpg' 'images/**' \
            | xargs -0 -r -I{} cp --parents {} _deploy-images/
          echo "staged $(find _deploy-images -type f | wc -l) file(s), $(du -sh _deploy-images | cut -f1)"

      # The exclude list only makes sense for the `full` scope, which syncs the
      # whole tree. The staged scopes have already been narrowed to exactly what
      # should ship, and applying the full list to them would be actively wrong:
      # `**/*.jpg` would filter out every last file of the images payload.
      #
      # `tr -d '\r'` is load-bearing. .gitattributes sets `* -text` so that twenty
      # years of mixed-ending archive files round-trip byte for byte, which means
      # this file arrives on a Linux runner with CRLF intact. Left alone, every
      # pattern handed to the action would end in a carriage return and match
      # nothing at all -- an exclude list that reads correctly and protects
      # nothing.
      #
      # The awk line emits a second form of every directory pattern: `you/**/x/**`
      # is also sent as `you/**/x/`. The action tests a folder by appending a
      # slash to its name and matching that, so the folder record for
      # `you/2009/e/gallery` is offered to the patterns as
      # `you/2009/e/gallery/`. Today's multimatch matches that with the `/**`
      # form, because a trailing globstar is allowed to match nothing -- verified
      # against the exact version the action bundles. That is a subtlety of one
      # matcher release, though, and the cost of it changing is the archive. The
      # explicit folder form does not depend on it.
      - name: Build the exclude list
        id: excludes
        run: |
          {
            echo 'list<<EXCLUDE_EOF'
            if [ "${{ inputs.scope }}" = "full" ]; then
              tr -d '\r' < .github/deploy-exclude.txt \
                | grep -v '^\s*#' | grep -v '^\s*$' \
                | awk '{ print; if (sub(/\/\*\*$/, "/")) print }'
            else
              printf '%s\n' '**/.git*' '**/.git*/**'
            fi
            echo 'EXCLUDE_EOF'
          } >> "$GITHUB_OUTPUT"

      # The first full deploy removed 16,479 photographs, because excluding
      # **/*.jpg protects a file the sync considers but not a directory it
      # decides is gone. Retiring the per-photo pages left you/**/gallery/ and
      # you/**/page-N/ with no tracked files, so the checkout had no such folders
      # and the sync pruned them from the server, photographs and all.
      #
      # The directory patterns in deploy-exclude.txt are what stop that
      # happening again, which makes them load-bearing rather than tidy-up. This
      # refuses to deploy if they are ever dropped, since the damage is silent:
      # the run goes green and the loss only shows up as broken images.
      - name: Refuse to deploy if the archive is unprotected
        if: ${{ inputs.scope == 'full' }}
        run: |
          missing=""
          for pat in 'you/**/gallery/**' 'you/**/page-*/**' '**/*.jpg' '**/*.jpeg'; do
            tr -d '\r' < .github/deploy-exclude.txt | grep -qxF "$pat" || missing="$missing $pat"
          done
          if [ -n "$missing" ]; then
            echo "::error title=Archive unprotected::deploy-exclude.txt is missing:$missing -- a full deploy would delete photographs. See the notes in that file."
            exit 1
          fi
          echo "The photograph directories are excluded. A full deploy will leave them alone."

      # The publish profile states the FTP endpoint as a full URL --
      # ftps://waws-prod-xxx.ftp.azurewebsites.windows.net/site/wwwroot/ -- and
      # that is what anyone will paste into the secret, because it is what the
      # portal hands you. The action wants a bare hostname in `server` and the
      # remote path in `server-dir`, and answers a URL with ENOTFOUND. Splitting
      # it here is better than requiring the secret to be stored in a shape that
      # nothing else produces. A bare hostname is passed through unchanged.
      - name: Resolve the FTP endpoint
        id: ftp
        env:
          RAW: ${{ secrets.AZURE_FTP_SERVER }}
        run: |
          rest="${RAW#*://}"
          host="${rest%%/*}"
          if [ "$rest" = "$host" ]; then path=""; else path="/${rest#*/}"; fi
          case "$path" in ""|"/") path="/site/wwwroot/" ;; esac
          case "$path" in */) ;; *) path="$path/" ;; esac
          echo "::add-mask::$host"
          echo "host=$host" >> "$GITHUB_OUTPUT"
          echo "dir=$path" >> "$GITHUB_OUTPUT"
          echo "resolved endpoint, deploying to $path"

      # basic-ftp closes its client whenever a socket errors, and on a first
      # publish the sync-state file does not exist yet. The action RETRs it, the
      # server rejects the missing file, the data socket is reset, and
      # @samkirkland/ftp-deploy catches that as "this must be your first publish"
      # without noticing the client is now dead. The very next command - the first
      # MKD - then fails with
      #
      #     Client is closed because read ECONNRESET (data socket)
      #
      # which is exactly what the first live run did, at ".well-known/", straight
      # after printing a correct 14,559-file plan. A dry run never notices because
      # it issues no further commands after the diff.
      #
      # Seeding an empty state file removes the failing RETR. Empty means "the
      # server holds nothing", so the action still uploads everything and still
      # deletes nothing: the same plan the dry run printed, just arrived at
      # without tripping over a missing file. It only runs when the file is truly
      # absent, so a real state file from an earlier deploy is never clobbered.
      #
      # This also answers the question the failure raised, which is whether FTPS
      # data transfers work from a runner at all. curl uses the same passive FTPS
      # path; if it cannot write this file, the problem is the network or Azure
      # rather than the library, and no amount of retrying the action will help.
      - name: Seed or reset the sync state file
        if: ${{ !inputs.dry-run }}
        env:
          HOST: ${{ steps.ftp.outputs.host }}
          DIR: ${{ steps.ftp.outputs.dir }}
          FTP_USER: ${{ secrets.AZURE_FTP_USERNAME }}
          FTP_PASS: ${{ secrets.AZURE_FTP_PASSWORD }}
          STATE: .ftp-deploy-${{ inputs.scope }}.json
        run: |
          set -uo pipefail
          url="ftp://${HOST}${DIR}${STATE}"

          # `reset-state` overwrites the baseline instead of reading it. An empty
          # baseline means the action believes the server holds nothing, so every
          # difference it finds is an upload and the delete list is empty by
          # construction -- no pattern has to be correct for the archive to
          # survive. That is the whole point: it removes deletion from the run
          # rather than protecting against it.
          #
          # It is worth reaching for whenever the checkout has lost files the last
          # deploy recorded. Retiring the 8,036 per-photo pages did exactly that,
          # and the resulting delete list took 16,479 photographs with it.
          if [ "${{ inputs.reset-state }}" = "true" ]; then
            echo "reset-state was requested, so $STATE will be overwritten with an empty baseline."
            echo "This deploy will upload what differs and delete nothing at all."
          else

          # The action itself defaults to security: loose, so accepting an
          # unverified certificate here keeps one connection policy across the
          # whole job. Strict is tried first regardless, because if the
          # certificate does verify there is no reason to accept less.
          if curl -fsS --ssl-reqd --user "$FTP_USER:$FTP_PASS" -o /dev/null "$url"; then
            echo "$STATE is already on the server; leaving it exactly as it is."
            exit 0
          fi
          if curl -fsS --ssl-reqd -k --user "$FTP_USER:$FTP_PASS" -o /dev/null "$url"; then
            echo "$STATE is already on the server; leaving it exactly as it is."
            echo "(the certificate did not verify strictly, which matches the action's own default)"
            exit 0
          fi

          echo "$STATE is not on the server, so this scope has never completed a deploy. Seeding it."
          fi
          printf '%s' '{"description":"Seeded by the deploy workflow so that a first publish does not have to RETR a file that is not there. Safe to delete - the next deploy would simply resync.","version":"1.0.0","generatedTime":0,"data":[]}' > "$RUNNER_TEMP/seed.json"

          note=""
          if ! curl -fsS --ssl-reqd --user "$FTP_USER:$FTP_PASS" -T "$RUNNER_TEMP/seed.json" "$url"; then
            echo "The strict upload failed; retrying the way the action itself connects."
            note=" (without strict certificate checking)"
            if ! curl -fsS --ssl-reqd -k --user "$FTP_USER:$FTP_PASS" -T "$RUNNER_TEMP/seed.json" "$url"; then
              echo "::error::Could not write to the server over FTPS. The control connection authenticates but no data transfer completes, which points at the network path or at Azure rather than at the deploy library. See the Kudu fallback in DEPLOY.md."
              exit 1
            fi
          fi
          rm -f "$RUNNER_TEMP/seed.json"
          echo "Seeded $STATE$note. FTPS data transfers work from this runner."

      - name: Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ steps.ftp.outputs.host }}
          server-dir: ${{ steps.ftp.outputs.dir }}
          username: ${{ secrets.AZURE_FTP_USERNAME }}
          password: ${{ secrets.AZURE_FTP_PASSWORD }}
          protocol: ftps
          dry-run: ${{ inputs.dry-run }}
          local-dir: ${{ inputs.scope == 'config-only' && './_deploy-config/' || inputs.scope == 'images' && './_deploy-images/' || './' }}
          # One sync-state file per scope, and this matters more than it looks.
          # The action decides what to delete by comparing the server's state file
          # against the local directory. Share one file between scopes and the
          # first `images` run after a `full` run would read a manifest listing
          # the whole site, find only thumbnails on disk, and conclude that every
          # page had been deleted. Separate manifests keep each scope's idea of
          # "what I put there" to itself.
          state-name: .ftp-deploy-${{ inputs.scope }}.json
          exclude: ${{ steps.excludes.outputs.list }}

      # A dry run and a real deploy both finish green, and the summary page looks
      # identical either way -- which is exactly how two "successful" runs can
      # leave the site untouched and send you hunting for the bug somewhere else.
      # This writes the distinction to the run summary, where it cannot be missed.
      - name: Say plainly whether anything was written
        if: ${{ always() }}
        run: |
          if [ "${{ inputs.dry-run }}" = "true" ]; then
            {
              echo "## :mag: Dry run — nothing was written"
              echo ""
              echo "The list above is what **would** be sent for scope \`${{ inputs.scope }}\`."
              echo "The server is unchanged, and the smoke test was skipped."
              echo ""
              if [ "${{ inputs.reset-state }}" = "true" ]; then
                echo "> **Note.** \`reset-state\` only takes effect on a real deploy, so the list above was"
                echo "> still measured against the *existing* server baseline. Any deletions it shows are"
                echo "> what would happen **without** the reset; with it, the delete list is empty."
                echo ""
              fi
              echo "To publish, run the workflow again with **dry-run unchecked**."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=Dry run::Nothing was written. Re-run with dry-run unchecked to publish."
          else
            {
              echo "## :rocket: Published — scope \`${{ inputs.scope }}\`"
              echo ""
              if [ "${{ inputs.reset-state }}" = "true" ]; then
                echo "The server baseline was reset first, so this deploy could only add and overwrite. Nothing was deleted."
                echo ""
              fi
              echo "The server was written to. The smoke test runs next, against the live site."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # The deploy step reports success as soon as the last byte is written, which
      # says nothing about whether the site still works. This is the step that
      # would notice a site-wide 500, a redirect map that never loaded, or cache
      # headers that silently did not take effect.
      #
      # Six of the checks - the two legacy redirect checks, the two /you/ retirement
      # redirects, the custom 404 and the cache lifetime - test behaviour that only
      # web.config produces, and web.config ships in its own scope. So rather than
      # assume, ask the server: X-Content-Type-Options is a header nothing but our
      # web.config sends. If it is absent the config has not shipped yet and those
      # checks are not applicable; once it is there, every run tests everything.
      - name: Smoke test the live site
        if: ${{ !inputs.dry-run }}
        env:
          SITE: https://www.davidconger.com
        run: |
          sleep 20
          if [ "${{ inputs.scope }}" = "config-only" ]; then
            node tools/smoke-test.js "$SITE" --only=home,redirect-issued,notfound,cache,atproto,rotator,you-photo-redirect,you-gallery-redirect,photos-gallery,photos-pages
          elif curl -sS -o /dev/null -D - "$SITE/" | grep -qi '^x-content-type-options:'; then
            node tools/smoke-test.js "$SITE"
          else
            echo "web.config has not been deployed yet, so the checks that depend on it are not applicable."
            node tools/smoke-test.js "$SITE" --skip=redirect,redirect-issued,notfound,cache,atproto,rotator,you-photo-redirect,you-gallery-redirect
          fi
