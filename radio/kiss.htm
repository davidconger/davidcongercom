<script language="JavaScript">
var ImageArr1 = new Array("images/dave1a.jpg","images/dave2a.jpg","images/dave3a.jpg");
var ImageHolder1 = document.getElementById('Rotating1');

var ImageArr2 = new Array("images/dave1b.jpg","images/dave2b.jpg","images/dave3b.jpg");
var ImageHolder2 = document.getElementById('Rotating2');

var ImageArr3 = new Array("images/dave1c.jpg","images/dave2c.jpg","images/dave3c.jpg");
var ImageHolder3 = document.getElementById('Rotating3');

function RotateImages(whichHolder,Start)
{
var a = eval("ImageArr"+whichHolder);
var b = eval("ImageHolder"+whichHolder);
if(Start>=a.length)
	Start=0;
//b.src = a[Start];
blendimage("Container"+whichHolder, "Rotating"+whichHolder, a[Start], 500);
window.setTimeout("RotateImages("+whichHolder+","+(Start+1)+")",10000);
}

function blendimage(divid, imageid, imagefile, millisec) { 
    var speed = Math.round(millisec / 100); 
    var timer = 0; 
     
    //set the current image as background 
    document.getElementById(divid).style.backgroundImage = "url(" + document.getElementById(imageid).src + ")"; 
     
    //make image transparent 
    changeOpac(0, imageid); 
     
    //make new image 
    document.getElementById(imageid).src = imagefile; 

    //fade in image 
    for(i = 0; i <= 100; i++) { 
        setTimeout("changeOpac(" + i + ",'" + imageid + "')",(timer * speed)); 
        timer++; 
    } 
} 

//change the opacity for different browsers 
function changeOpac(opacity, id) { 
    var object = document.getElementById(id).style; 
    object.opacity = (opacity / 100); 
    object.MozOpacity = (opacity / 100); 
    object.KhtmlOpacity = (opacity / 100); 
    object.filter = "alpha(opacity=" + opacity + ")"; 
} 

window.setTimeout("RotateImages(1,1)",5000)
window.setTimeout("RotateImages(2,1)",5500)
window.setTimeout("RotateImages(3,1)",6000)

</script>
