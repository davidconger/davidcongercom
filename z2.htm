var totalRotations = 0;

var keepRotating = false;

function RotateImage()
{
	var nextId = activeImage + 1;
	if (nextId >= imageArray.length)
	{
		nextId = 0;
	}
	
	var splitString = imageArray[nextId].split(';');
	
    document.getElementById("focusImage").style.backgroundImage = 'url(' + splitString[0] + ')';
    document.getElementById("focusArtist").innerHTML = splitString[2];
    document.getElementById("focusVenue").innerHTML = splitString[3]; 
    document.getElementById("focusDate").innerHTML = splitString[1]; 
    document.getElementById("focusTextBoxSize").style.width = splitString[4] + 'px'; 
    
    activeImage = nextId;
    
    if (keepRotating && totalRotations < 15)
    {
	    window.setTimeout("RotateImage()",4000)
    }
    
    totalRotations++;
}

function Start()
{
	window.setTimeout("RotateImage()",1500)
	keepRotating = true;
}
